<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Betty Car</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="dashboard-header">
    <div class="container">
      <h1>Admin Dashboard</h1>
      <p style="opacity:0.8;margin-top:0.5rem">Manage cars, bookings, and platform operations.</p>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="stats-grid">
        <div class="stat-card"><strong id="stat-cars">-</strong><span>Total Cars</span></div>
        <div class="stat-card"><strong id="stat-bookings">-</strong><span>Total Bookings</span></div>
        <div class="stat-card"><strong id="stat-users">-</strong><span>Registered Users</span></div>
        <div class="stat-card"><strong id="stat-revenue">-</strong><span>Total Revenue</span></div>
      </div>

      <div class="dashboard-tabs">
        <button class="tab-btn active" data-tab="tab-cars-admin">Manage Cars</button>
        <button class="tab-btn" data-tab="tab-bookings-admin">Bookings</button>
      </div>

      <div id="tab-cars-admin" class="tab-panel active">
        <div class="admin-form">
          <h3 id="car-form-title" style="margin-bottom:1rem;color:var(--primary)">Add New Car</h3>
          <form id="car-form">
            <input type="hidden" id="car-id">
            <div class="form-row">
              <div class="form-group"><label for="car-name">Name</label><input type="text" id="car-name" class="form-control" required></div>
              <div class="form-group"><label for="car-brand">Brand</label><input type="text" id="car-brand" class="form-control" required></div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="car-type">Type</label>
                <select id="car-type" class="form-control" required>
                  <option value="Sedan">Sedan</option><option value="SUV">SUV</option><option value="Luxury">Luxury</option>
                  <option value="Van">Van</option><option value="Pickup">Pickup</option><option value="Minivan">Minivan</option>
                  <option value="Convertible">Convertible</option><option value="Truck">Truck</option><option value="Electric">Electric</option>
                  <option value="Compact">Compact</option>
                </select>
              </div>
              <div class="form-group"><label for="car-price">Price/Day (ETB)</label><input type="number" id="car-price" class="form-control" required min="0"></div>
            </div>
            <div class="form-group mb-2"><label for="car-image">Image URL</label><input type="url" id="car-image" class="form-control" required></div>
            <div class="form-group mb-2"><label for="car-description">Description</label><textarea id="car-description" class="form-control" rows="3" required></textarea></div>
            <div class="form-row">
              <label><input type="checkbox" id="car-available" checked> Available</label>
              <label><input type="checkbox" id="car-featured"> Featured</label>
            </div>
            <div style="display:flex;gap:0.75rem;margin-top:1rem">
              <button type="submit" class="btn btn-primary">Save Car</button>
              <button type="button" id="reset-car-form" class="btn btn-outline" style="color:var(--primary);border-color:var(--border)">Reset</button>
            </div>
          </form>
        </div>
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr><th>Name</th><th>Type</th><th>Price</th><th>Available</th><th>Rating</th><th>Actions</th></tr></thead>
            <tbody id="admin-cars-body"></tbody>
          </table>
        </div>
      </div>

      <div id="tab-bookings-admin" class="tab-panel">
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr><th>Customer</th><th>Car</th><th>Dates</th><th>Total</th><th>Status</th></tr></thead>
            <tbody id="admin-bookings-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
