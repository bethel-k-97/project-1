<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard - Betty Car</title>
  <meta name="description" content="Manage your Betty Car bookings, favorites, and profile.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="dashboard-header">
    <div class="container">
      <h1 id="dashboard-greeting">My Dashboard</h1>
      <p style="opacity:0.8;margin-top:0.5rem">Manage your bookings, favorites, and account settings.</p>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="dashboard-tabs">
        <button class="tab-btn active" data-tab="tab-bookings">My Bookings</button>
        <button class="tab-btn" data-tab="tab-favorites">Favorites</button>
        <button class="tab-btn" data-tab="tab-profile">Profile</button>
      </div>

      <div id="tab-bookings" class="tab-panel active">
        <div id="bookings-list"></div>
      </div>

      <div id="tab-favorites" class="tab-panel">
        <div id="favorites-list"></div>
      </div>

      <div id="tab-profile" class="tab-panel">
        <div class="content-card" style="max-width:500px">
          <h2>Update Profile</h2>
          <form id="profile-form">
            <div class="form-group mb-2">
              <label for="profile-name">Full Name</label>
              <input type="text" id="profile-name" name="name" class="form-control" required>
            </div>
            <div class="form-group mb-2">
              <label for="profile-email">Email</label>
              <input type="email" id="profile-email" class="form-control" disabled>
            </div>
            <div class="form-group mb-2">
              <label for="profile-phone">Phone</label>
              <input type="tel" id="profile-phone" name="phone" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/home.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
